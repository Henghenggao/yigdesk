<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yigdesk decision workbench</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f4ef;
        --panel: rgba(255, 255, 255, 0.82);
        --ink: #15221d;
        --muted: #607069;
        --line: rgba(27, 57, 46, 0.14);
        --green: #0c704c;
        --green-soft: #dff2e8;
        --amber: #9b5a09;
        --amber-soft: #fff0d6;
        --red: #9c352f;
        --red-soft: #fbe5e2;
        --shadow: 0 18px 50px rgba(23, 48, 39, 0.1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111815;
          --panel: rgba(25, 35, 31, 0.92);
          --ink: #eef6f1;
          --muted: #9fb0a8;
          --line: rgba(220, 240, 230, 0.14);
          --green: #6bd4a7;
          --green-soft: #183c2f;
          --amber: #f6bd68;
          --amber-soft: #44351d;
          --red: #f18f87;
          --red-soft: #492a29;
          --shadow: none;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 0;
        background:
          radial-gradient(circle at 95% 0%, rgba(69, 160, 116, 0.12), transparent 34%),
          var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button, select { font: inherit; }
      button { color: inherit; }
      .shell { padding: 14px; }
      .workbench {
        width: min(100%, 920px);
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 13px 18px;
        border-bottom: 1px solid var(--line);
      }
      .live {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .live::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 5px rgba(45, 156, 109, 0.12);
        content: "";
      }
      .toolbar-actions { display: flex; align-items: center; gap: 8px; }
      .quiet, .history-select {
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: transparent;
        padding: 6px 10px;
        cursor: pointer;
      }
      .history-select { max-width: 220px; color: var(--muted); }
      .hero { padding: 28px 28px 22px; }
      .eyebrow {
        margin: 0 0 8px;
        color: var(--green);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
      h1 { margin: 0; font-size: clamp(24px, 4vw, 38px); line-height: 1.08; letter-spacing: -0.035em; }
      h2 { margin: 0; font-size: 16px; }
      .status {
        flex: 0 0 auto;
        border-radius: 999px;
        padding: 7px 11px;
        background: var(--amber-soft);
        color: var(--amber);
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
      }
      .status.resolved { background: var(--green-soft); color: var(--green); }
      .status.held, .status.revision_requested { background: var(--red-soft); color: var(--red); }
      .conclusion { max-width: 720px; margin: 17px 0 0; color: var(--muted); font-size: 16px; line-height: 1.55; }
      .section { padding: 22px 28px; border-top: 1px solid var(--line); }
      .section-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      th, td { padding: 13px 10px; border-bottom: 1px solid var(--line); text-align: right; }
      th:first-child, td:first-child { padding-left: 0; text-align: left; }
      th:last-child, td:last-child { padding-right: 0; }
      thead th { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
      tbody th { font-size: 14px; }
      .candidate-name { display: block; }
      .candidate-label { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 500; }
      .verdict { display: inline-block; border-radius: 999px; padding: 5px 8px; background: var(--green-soft); color: var(--green); font-size: 11px; font-weight: 800; }
      .verdict:not(.ok) { background: var(--red-soft); color: var(--red); }
      .proof-summary { margin: 0; color: var(--muted); font-size: 13px; }
      .proof-track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 18px 0 0; padding: 0; list-style: none; }
      .proof-step { min-width: 0; border: 1px solid var(--line); border-radius: 14px; padding: 13px; }
      .proof-step::before { display: block; width: 22px; height: 4px; margin-bottom: 12px; border-radius: 999px; background: var(--amber); content: ""; }
      .proof-step.passed::before, .proof-step.ready::before, .proof-step.committed::before { background: var(--green); }
      .proof-step.terminal::before, .proof-step.blocked::before { background: var(--red); }
      .proof-state { display: block; margin-bottom: 5px; color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; }
      .proof-step strong { display: block; font-size: 13px; }
      .proof-step small { display: block; margin-top: 7px; color: var(--muted); line-height: 1.35; }
      .record { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 10px; margin: 14px 0 0; }
      .record div { min-width: 0; }
      .record dt { color: var(--muted); font-size: 10px; text-transform: uppercase; }
      .record dd { overflow: hidden; margin: 5px 0 0; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
      .evidence-grid { display: grid; grid-template-columns: 1.35fr 0.65fr; gap: 14px; }
      .evidence-list, .risk { border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
      .evidence-item + .evidence-item { margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--line); }
      .evidence-item strong { color: var(--green); font-size: 11px; text-transform: uppercase; }
      .evidence-item p, .risk p { margin: 7px 0; font-size: 13px; line-height: 1.45; }
      .evidence-item small, .risk small { color: var(--muted); font-size: 11px; }
      .risk { background: var(--amber-soft); border-color: transparent; }
      .risk .eyebrow { color: var(--amber); }
      .gate { background: rgba(41, 114, 83, 0.055); }
      .gate-copy { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
      .role { color: var(--green); font-weight: 800; }
      .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
      .action {
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: transparent;
        padding: 9px 14px;
        font-weight: 750;
        cursor: pointer;
      }
      .action.primary { border-color: var(--green); background: var(--green); color: white; }
      .action:disabled { cursor: not-allowed; opacity: 0.45; }
      .action-note { margin: 12px 0 0; color: var(--muted); font-size: 12px; }
      .notice { margin: 0 28px 20px; border-radius: 12px; padding: 11px 13px; background: var(--green-soft); color: var(--green); font-size: 13px; }
      .notice.error { background: var(--red-soft); color: var(--red); }
      .empty { padding: 48px 28px; text-align: center; }
      .empty p { color: var(--muted); }
      @media (max-width: 680px) {
        .shell { padding: 8px; }
        .workbench { border-radius: 18px; }
        .toolbar, .hero, .section { padding-left: 17px; padding-right: 17px; }
        .toolbar { align-items: flex-start; }
        .title-row { display: block; }
        .status { display: inline-block; margin-top: 12px; }
        .proof-track { grid-template-columns: 1fr 1fr; }
        .record { grid-template-columns: 1fr 1fr; }
        .evidence-grid { grid-template-columns: 1fr; }
        .history-select { max-width: 150px; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div id="root" class="workbench" aria-live="polite"></div>
    </main>
    <script>
      (() => {
        "use strict";

        const VIEW_VERSION = "yigdesk-decision-view/v3";
        const ACTION_VERSION = "yigdesk-agent-action/v1";
        const BLOCK_TYPES = new Set(["comparison", "proof", "evidence", "warning", "actions", "history"]);
        const root = document.getElementById("root");
        const state = { manifest: null, selectedId: null, stateVersion: 0, notice: "", error: "", busy: false };
        let rpcId = 0;
        const pendingRequests = new Map();

        function el(tag, attrs = {}, children = []) {
          const node = document.createElement(tag);
          for (const [key, value] of Object.entries(attrs)) {
            if (value === null || value === undefined || value === false) continue;
            if (key === "text") node.textContent = String(value);
            else if (key === "class") node.className = String(value);
            else if (key === "onClick") node.addEventListener("click", value);
            else if (key === "onChange") node.addEventListener("change", value);
            else node.setAttribute(key, value === true ? "" : String(value));
          }
          const list = Array.isArray(children) ? children : [children];
          for (const child of list) {
            if (child === null || child === undefined || child === false) continue;
            node.append(child instanceof Node ? child : document.createTextNode(String(child)));
          }
          return node;
        }

        function rpcNotify(method, params) {
          window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
        }

        function rpcRequest(method, params) {
          return new Promise((resolve, reject) => {
            const id = ++rpcId;
            pendingRequests.set(id, { resolve, reject });
            window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
          });
        }

        function isTrustedManifest(value) {
          if (!value || value.version !== VIEW_VERSION || !Array.isArray(value.decisions)) return false;
          return value.decisions.every((decision) =>
            decision && typeof decision.id === "string" && typeof decision.title === "string" &&
            typeof decision.status === "string" && typeof decision.conclusion === "string" &&
            Array.isArray(decision.blocks) && decision.blocks.every((item) => item && BLOCK_TYPES.has(item.type))
          );
        }

        function updateFromResponse(response) {
          const structured = response && response.structuredContent ? response.structuredContent : response;
          const manifest = structured && structured.view;
          if (!isTrustedManifest(manifest)) {
            state.error = "The host returned an unsupported decision view.";
            render();
            return;
          }
          state.manifest = manifest;
          state.stateVersion = Number(structured.stateVersion || 0);
          const decisions = manifest.decisions;
          if (!state.selectedId || !decisions.some((item) => item.id === state.selectedId)) {
            const active = decisions.find((item) => item.status !== "resolved");
            state.selectedId = (active || decisions[0] || {}).id || null;
          }
          state.error = "";
          render();
        }

        window.addEventListener("message", (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;
          if (typeof message.id === "number") {
            const pending = pendingRequests.get(message.id);
            if (!pending) return;
            pendingRequests.delete(message.id);
            if (message.error) pending.reject(message.error);
            else pending.resolve(message.result);
            return;
          }
          if (message.method === "ui/notifications/tool-result") updateFromResponse(message.params);
        }, { passive: true });

        async function initializeBridge() {
          await rpcRequest("ui/initialize", {
            appInfo: { name: "yigdesk-decision-workbench", version: "1.0.0" },
            appCapabilities: {},
            protocolVersion: "2026-01-26"
          });
          rpcNotify("ui/notifications/initialized", {});
        }

        const bridgeReady = initializeBridge().catch((error) => {
          if (!window.openai || typeof window.openai.callTool !== "function") throw error;
        });

        async function callTool(name, args) {
          try {
            await bridgeReady;
            return await rpcRequest("tools/call", { name, arguments: args });
          } catch (bridgeError) {
            if (window.openai && typeof window.openai.callTool === "function") {
              return window.openai.callTool(name, args);
            }
            throw bridgeError;
          }
        }

        function block(decision, type) {
          return decision.blocks.find((item) => item.type === type) || null;
        }

        function formatMetric(value, unit) {
          if (value === null || value === undefined || value === "") return "—";
          const number = Number(value);
          if (!Number.isFinite(number)) return String(value);
          return `${number.toFixed(2)}${unit === "pt" ? " pt" : "%"}`;
        }

        function compact(value) {
          if (!value) return "Pending commit";
          const text = String(value);
          return text.length > 24 ? `${text.slice(0, 14)}…${text.slice(-6)}` : text;
        }

        function renderToolbar(decisions) {
          const controls = el("div", { class: "toolbar-actions" });
          if (decisions.length > 1) {
            const select = el("select", {
              class: "history-select",
              "aria-label": "Decision history",
              onChange: (event) => { state.selectedId = event.target.value; render(); }
            });
            for (const decision of decisions) {
              const option = el("option", { value: decision.id, text: `${decision.title} · ${decision.status}` });
              if (decision.id === state.selectedId) option.selected = true;
              select.append(option);
            }
            controls.append(select);
          }
          if (window.openai && typeof window.openai.requestDisplayMode === "function") {
            controls.append(el("button", {
              class: "quiet", type: "button", text: "Expand",
              onClick: () => window.openai.requestDisplayMode({ mode: "fullscreen" })
            }));
          }
          return el("div", { class: "toolbar" }, [
            el("span", { class: "live", text: `Live proof · #${state.stateVersion}` }),
            controls
          ]);
        }

        function renderComparison(comparison) {
          if (!comparison || !Array.isArray(comparison.candidates)) return null;
          const body = el("tbody");
          for (const candidate of comparison.candidates) {
            body.append(el("tr", {}, [
              el("th", { scope: "row" }, [
                el("span", { class: "candidate-name", text: candidate.name || candidate.id }),
                el("span", { class: "candidate-label", text: candidate.label || "" })
              ]),
              el("td", { text: formatMetric(candidate.gross_margin, "%") }),
              el("td", { text: formatMetric(candidate.headroom, "pt") }),
              el("td", {}, el("span", { class: `verdict ${candidate.verdict || "hold"}`, text: candidate.verdict === "ok" ? "Eligible" : "Hold" }))
            ]));
          }
          const table = el("table", {}, [
            el("thead", {}, el("tr", {}, [
              el("th", { text: "Candidate" }), el("th", { text: "Gross margin" }),
              el("th", { text: "Headroom" }), el("th", { text: "Status" })
            ])), body
          ]);
          return el("section", { class: "section" }, [
            el("div", { class: "section-head" }, el("h2", { text: comparison.title || "Candidate comparison" })),
            el("div", { class: "table-wrap" }, table)
          ]);
        }

        function renderProof(proof) {
          if (!proof || !Array.isArray(proof.items) || !proof.record) return null;
          const track = el("ol", { class: "proof-track" });
          for (const item of proof.items) {
            track.append(el("li", { class: `proof-step ${item.status || "waiting"}` }, [
              el("span", { class: "proof-state", text: item.status || "waiting" }),
              el("strong", { text: item.label || "Proof step" }),
              el("small", { text: item.detail || "" })
            ]));
          }
          const record = proof.record;
          const recordList = el("dl", { class: "record" }, [
            el("div", {}, [el("dt", { text: "Source" }), el("dd", { title: record.source_fingerprint || "", text: compact(record.source_fingerprint) })]),
            el("div", {}, [el("dt", { text: "Evaluator" }), el("dd", { title: record.evaluator_revision || "", text: compact(record.evaluator_revision) })]),
            el("div", {}, [el("dt", { text: "Input cutoff" }), el("dd", { text: record.cutoff_seq === null ? "Collecting" : `#${record.cutoff_seq}` })]),
            el("div", {}, [el("dt", { text: "Ledger" }), el("dd", { text: record.ledger_seq === null ? "Not committed" : `#${record.ledger_seq}` })]),
            el("div", {}, [el("dt", { text: "Closed by" }), el("dd", { text: record.closed_by || "Pending" })]),
            el("div", {}, [el("dt", { text: "Agents" }), el("dd", { text: record.agent_count ? `${record.agent_count} declared` : "Not declared" })])
          ]);
          return el("section", { class: "section" }, [
            el("div", { class: "section-head" }, [
              el("h2", { text: proof.title || "Decision proof" }),
              el("p", { class: "proof-summary", text: proof.summary || "" })
            ]), track, recordList
          ]);
        }

        function renderEvidence(evidence, warning) {
          if (!evidence || !warning) return null;
          const list = el("div", { class: "evidence-list" });
          for (const item of Array.isArray(evidence.items) ? evidence.items : []) {
            list.append(el("div", { class: "evidence-item" }, [
              el("strong", { text: item.type || "Evidence" }),
              el("p", { text: item.body || "" }),
              el("small", { text: Array.isArray(item.refs) ? item.refs.join(" · ") : "" })
            ]));
          }
          const risk = el("aside", { class: "risk" }, [
            el("p", { class: "eyebrow", text: warning.title || "Risk boundary" }),
            el("p", { text: warning.body || "" }),
            el("small", { text: Array.isArray(warning.refs) ? warning.refs.join(" · ") : "" })
          ]);
          return el("section", { class: "section" }, el("div", { class: "evidence-grid" }, [list, risk]));
        }

        function actionVerdict(actionType) {
          return actionType === "approve_candidate" ? "approve" : actionType === "hold" ? "hold" : "reject";
        }

        function continuationPrompt(decision, action) {
          if (action.action_type === "approve_candidate") {
            return `I approved candidate ${action.candidate_id} for decision ${decision.id}. Read the updated board, call request_resolve for ${decision.id}, and explain the deterministic gate result.`;
          }
          if (action.action_type === "hold") {
            return `I placed decision ${decision.id} on hold. Read the updated board and summarize exactly what was recorded. Do not resolve it.`;
          }
          return `I requested a revision for decision ${decision.id}. Read the updated board and continue the agent workflow with a revised measurable candidate. Do not resolve the current proposal.`;
        }

        async function runAction(decision, actions, action) {
          if (state.busy || !action.enabled) return;
          state.busy = true;
          state.notice = "Recording your intent…";
          state.error = "";
          render();
          const actionId = (window.crypto && window.crypto.randomUUID)
            ? window.crypto.randomUUID()
            : `action-${Date.now()}-${Math.random().toString(16).slice(2)}`;
          try {
            const response = await callTool("cast_approval", {
              decision_id: decision.id,
              verdict: actionVerdict(action.action_type),
              scope: action.candidate_id || decision.id,
              role: actions.role || "reviewer",
              action_id: actionId,
              correlation_id: actionId,
              action_type: action.action_type,
              candidate_id: action.candidate_id
            });
            updateFromResponse(response);
            state.notice = action.action_type === "approve_candidate"
              ? "Approval recorded. ChatGPT will now ask the deterministic gate to resolve."
              : action.action_type === "hold"
                ? "Hold recorded. No deterministic resolution will run."
                : "Revision request recorded for the agent workflow.";
            rpcNotify("ui/message", {
              role: "user",
              content: [{ type: "text", text: continuationPrompt(decision, action) }]
            });
          } catch (error) {
            state.error = error && error.message ? error.message : "The action could not be recorded.";
            state.notice = "";
          } finally {
            state.busy = false;
            render();
          }
        }

        function renderActions(decision, actions) {
          if (!actions || !Array.isArray(actions.items)) return null;
          const buttons = el("div", { class: "actions" });
          for (const action of actions.items) {
            const primary = action.action_type === "approve_candidate";
            buttons.append(el("button", {
              type: "button",
              class: `action${primary ? " primary" : ""}`,
              disabled: state.busy || !action.enabled,
              title: !action.enabled ? action.reason || "Unavailable" : "",
              text: action.label || action.action_type,
              onClick: () => runAction(decision, actions, action)
            }));
          }
          const reasons = [...new Set(actions.items.filter((item) => !item.enabled && item.reason).map((item) => item.reason))];
          return el("section", { class: "section gate" }, [
            el("div", { class: "section-head" }, el("div", {}, [
              el("p", { class: "eyebrow", text: "Human checkpoint" }),
              el("h2", { text: actions.title || "Human decision gate" }),
              el("p", { class: "gate-copy" }, [
                "Intent is appended to the ledger as ",
                el("span", { class: "role", text: actions.role || "reviewer" }),
                ". This synthetic demo declares the role locally; it is not authenticated identity."
              ])
            ])), buttons,
            reasons.length ? el("p", { class: "action-note", text: reasons.join(" ") }) : null
          ]);
        }

        function render() {
          root.replaceChildren();
          const decisions = state.manifest && Array.isArray(state.manifest.decisions) ? state.manifest.decisions : [];
          root.append(renderToolbar(decisions));
          if (!decisions.length) {
            root.append(el("section", { class: "empty" }, [
              el("h2", { text: state.error ? "Decision view unavailable" : "Waiting for a decision" }),
              el("p", { text: state.error || "Ask ChatGPT to read the Yigdesk board." })
            ]));
            return;
          }
          const decision = decisions.find((item) => item.id === state.selectedId) || decisions[0];
          root.append(el("header", { class: "hero" }, [
            el("p", { class: "eyebrow", text: "Deterministic decision workbench" }),
            el("div", { class: "title-row" }, [
              el("h1", { text: decision.title }),
              el("span", { class: `status ${decision.status}`, text: decision.status.replaceAll("_", " ") })
            ]),
            el("p", { class: "conclusion", text: decision.conclusion })
          ]));
          const sections = [
            renderComparison(block(decision, "comparison")),
            renderProof(block(decision, "proof")),
            renderEvidence(block(decision, "evidence"), block(decision, "warning")),
            renderActions(decision, block(decision, "actions"))
          ];
          for (const section of sections) if (section) root.append(section);
          if (state.error || state.notice) root.append(el("div", {
            class: `notice${state.error ? " error" : ""}`,
            role: "status",
            text: state.error || state.notice
          }));
        }

        const initial = window.openai && window.openai.toolOutput
          ? { structuredContent: window.openai.toolOutput }
          : window.__YIGDESK_WIDGET_DATA__
            ? { structuredContent: window.__YIGDESK_WIDGET_DATA__ }
            : null;
        if (initial) updateFromResponse(initial);
        else render();
      })();
    </script>
  </body>
</html>
