<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Yigdesk renders a deterministic decision board and lets a human drive the approval gate."
    />
    <meta name="theme-color" content="#153b34" />
    <title>Yigdesk — deterministic decision board</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#board-root">Skip to decision board</a>
    <header class="masthead">
      <a class="brand" href="/" aria-label="Yigdesk home">
        <span class="brand-mark" aria-hidden="true"><i>Y</i><i>D</i></span>
        <span class="brand-copy"><strong>Yigdesk</strong><small>Evidence before action</small></span>
      </a>
      <div class="topline">
        <span class="topline-item"><span class="live-dot" aria-hidden="true"></span>Deterministic board</span>
        <span class="topline-item">Human-driven gate</span>
        <span class="hairline" aria-hidden="true"></span>
        <span class="topline-item">No business write-back</span>
      </div>
    </header>

    <main id="board-root" data-testid="board-root" aria-label="Decision board">
      <p class="board-loading">Loading decision board…</p>
    </main>

    <!--
      Domain-neutral component library. Yigdesk ships these read-only components
      (<yig-grid> / <yig-model-inspector>) as part of its neutral public surface.
      The deterministic board projection carries candidates + metrics, not
      workbook cells, and exposes no cell-level view/inspect endpoint, so the
      components are retained here inert (inside a template) rather than wired to
      the board DTO. app.js renders candidates/metrics with plain elements.
    -->
    <template id="neutral-components">
      <yig-grid aria-label="Read-only object view"></yig-grid>
      <yig-model-inspector></yig-model-inspector>
    </template>

    <footer>
      <span>Yigdesk</span>
      <span>Deterministic decision blackboard</span>
    </footer>
  </body>
</html>
